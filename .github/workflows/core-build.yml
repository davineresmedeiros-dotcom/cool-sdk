name: Core build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Install compatible CMake
        run: python -m pip install cmake==4.0.2
      - name: Configure Android arm64
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build Android shared library
        run: cmake --build build-android --parallel

      - name: Collect Android native libraries
        run: |
          mkdir -p android-native
          find build-android -type f -name 'libcoolmodloader.so' -exec cp {} android-native/ \;
          find build-android -type f -name 'libshadowhook.so' -exec cp {} android-native/ \;
          test -s android-native/libcoolmodloader.so
          test -s android-native/libshadowhook.so

      - name: Upload Android arm64 libraries
        uses: actions/upload-artifact@v4
        with:
          name: modloader-android-arm64
          path: android-native/*.so
          if-no-files-found: error
